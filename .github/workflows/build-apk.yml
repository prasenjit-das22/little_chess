name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk LittleChess.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LittleChess-apk
          path: LittleChess.apk

      - name: Publish as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: little-chess-${{ github.run_number }}
          name: Little Chess build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: LittleChess.apk
          body: |
            Download **LittleChess.apk** below on your Android phone or tablet and open it to install
            (allow "install unknown apps" for your browser when asked).
